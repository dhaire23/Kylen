# Netlify configuration — Big Grit Performance
# Static site: no build step. Netlify Forms picks up the "application" form automatically.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Fonts and libraries never change name → cache for a year
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media keeps fixed file names so you can swap footage → short cache, refreshed in the background
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Settings must update immediately after a deploy
[[headers]]
  for = "/config/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Documentation and helper scripts are not part of the public site
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
